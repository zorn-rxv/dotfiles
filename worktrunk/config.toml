# Global worktrunk config: the user layer that runs for every repo. Per-repo
# steps belong in the repo's committed .config/wt.toml, which worktrunk runs
# after this file's hooks. A repo that should not carry them gets a [projects]
# section below.

# Blocking, so a repo's own pre-start hook can rely on what this one writes.
# worktrunk starts user and project post-start hooks together, with no order.
[pre-start]
profile = "~/.config/worktrunk/hooks/pre-start"

# Blocking: a failed drop stops the removal, so no database is left behind.
[pre-remove]
teardown = "~/.config/worktrunk/hooks/pre-remove"

# --no-cd keeps the console out of the new worktree. --label shortens its
# sidebar name to the first three words of a zorn/ branch's slug.
# worktrunk/README.md says why for both. --execute runs herdr from inside the
# new worktree, so `.` is its path.
[aliases]
herdr = 'wt switch --create {{ args }} --no-cd --execute herdr -- worktree open --cwd {{ primary_worktree_path }} --path . --focus --label {% set words = args[0] | replace("zorn/", "") | split("-") %}{{ words[0:3] | join(" ") if args[0] is startingwith("zorn/") else args[0] }}'
# Resumes a branch that exists on origin. --create would start from main and
# drop the pull request's commits.
herdr-resume = 'wt switch {{ args }} --no-cd --execute herdr -- worktree open --cwd {{ primary_worktree_path }} --path . --focus --label {% set words = args[0] | replace("zorn/", "") | split("-") %}{{ words[0:3] | join(" ") if args[0] is startingwith("zorn/") else args[0] }}'

# verify-doctor opts in from this machine alone, with nothing committed to its
# repo. These hooks run after the global ones above, so setup finds the port
# that pre-start wrote. The * stands for the repo's owner, which `wt config
# show` prints as part of the identifier.
[projects."github.com/*/verify-doctor".pre-start]
verify-doctor = "~/.config/worktrunk/hooks/verify-doctor setup {{ primary_worktree_path }}"

[projects."github.com/*/verify-doctor".post-start]
verify-doctor = "~/.config/worktrunk/hooks/verify-doctor create"

[projects."github.com/*/verify-doctor".pre-remove]
verify-doctor = "~/.config/worktrunk/hooks/verify-doctor drop"
